# Configuración de despliegue en Netlify para "Mapa de Solidaridad Real".
#
# El repositorio es un monorepo con npm workspaces (frontend, backend). Para que
# la instalación sea coherente, Netlify construye DESDE LA RAÍZ (no se fija
# `base = "frontend"`): instala las dependencias del workspace y luego compila
# solo el frontend. La salida publicada es `frontend/dist`.

[build]
  # Construye SOLO el frontend desde su carpeta, evitando instalar el backend
  # (cuyo postinstall de Prisma no es necesario para publicar el sitio).
  #
  # Se borra `package-lock.json` y `node_modules` antes de instalar para sortear
  # un bug conocido de npm con las dependencias OPCIONALES nativas de Rollup
  # (https://github.com/npm/cli/issues/4828): el lockfile se generó en Windows y
  # no incluye el binario nativo de Linux (`@rollup/rollup-linux-x64-gnu`) que
  # Vite necesita en Netlify. Reinstalar sin lock fuerza a npm a resolver el
  # binario correcto para la plataforma del build (Linux).
  #   - `npm install --include=dev` asegura además las devDependencies (vite,
  #     typescript, tailwind…) aunque Netlify fije NODE_ENV=production.
  base = "frontend"
  command = "rm -rf package-lock.json node_modules && npm install --include=dev && npm run build"
  # Carpeta de salida del build de Vite, relativa a `base`.
  publish = "dist"

[build.environment]
  # Versión de Node para el build (Vite 5 requiere Node 18+; usamos 20 LTS).
  NODE_VERSION = "20"

# Redirección para Single Page Application: cualquier ruta se sirve con el
# index.html para que el enrutado del lado cliente funcione y no dé 404 al
# recargar o entrar directo a una URL interna.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
